baseURL = "http://192.168.3.114:8080/"
locale = "zh-cn"
defaultContentLanguage = "zh"
title = "陈威的博客"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true

paginate = 10

[params]
  env = "production"
  description = "技术笔记 / 工程实践 / 学习记录"
  author = "陈威"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = false
  ShowToc = true
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "你好，我是陈威 👋"
    Content = "这里记录我的技术笔记、工程实践与学习心得。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/chenweidu666"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 30
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
